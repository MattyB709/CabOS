name: Tests

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  github_access_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Run all tests
              run: |
                  nix develop --command cargo buildtool test --target x86-64
                  nix develop --command cargo buildtool test --target aarch64

            - name: Upload cached testing directory on failure
              if: ${{ failure() }}
              uses: actions/upload-artifact@v4
              with:
                  name: buildtool-cache-testing
                  path: buildtool-cache/testing
                  if-no-files-found: warn
